<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Blob.io Real Multiplayer</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Üst Arayüz */
    #ui-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px; border-radius: 20px; color: #f8fafc; font-weight: 700; font-size: 14px;
      backdrop-filter: blur(8px);
    }
    .btn {
      pointer-events: auto; background: #2563eb; color: #fff; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-active { background: #16a34a !important; }

    /* Chat Kutusu */
    #chat-box {
      position: absolute; bottom: 20px; right: 20px; width: 240px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column;
      backdrop-filter: blur(8px); pointer-events: auto; z-index: 10;
    }
    #chat-msgs { height: 100px; overflow-y: auto; color: #e2e8f0; font-size: 12px; margin-bottom: 6px; }
    #chat-msgs p { margin-bottom: 4px; word-break: break-all; }
    #chat-input {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px; padding: 6px 10px; color: #fff; outline: none; font-size: 12px;
    }

    /* Joystick Arayüzü */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; pointer-events: auto; z-index: 10; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
      background: rgba(59, 130, 246, 0.8); border: 2px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui-bar">
    <div class="hud-card">Skor: <span id="score">0</span> | Online: <span id="online">1</span></div>
    <button id="mic-btn" class="btn" onclick="toggleMic()">🎤 Mikrofonu Aç</button>
  </div>

  <div id="chat-box">
    <div id="chat-msgs"><p style="color:#94a3b8;"><i>Küresel Sohbet Başlatıldı...</i></p></div>
    <input type="text" id="chat-input" placeholder="Mesaj yaz..." onkeydown="sendChat(event)">
  </div>

  <!-- Dokunmatik Joystick -->
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const MAP_SIZE = 3000;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let myId = "player_" + Math.random().toString(36).substring(2, 7);
    let players = {};
    let foods = [];

    // Oyuncu Fizik Değişkenleri
    players[myId] = {
      x: Math.random() * (MAP_SIZE - 400) + 200,
      y: Math.random() * (MAP_SIZE - 400) + 200,
      vx: 0, vy: 0,
      radius: 24,
      color: `hsl(${Math.floor(Math.random() * 360)}, 85%, 60%)`,
      score: 0,
      name: "Oyuncu_" + myId.substring(7)
    };

    // Sabit Harita Yemleri
    for (let i = 0; i < 250; i++) {
      foods.push({
        x: (i * 157.3) % MAP_SIZE,
        y: (i * 269.7) % MAP_SIZE,
        color: `hsl(${(i * 17) % 360}, 80%, 55%)`
      });
    }

    // --- JOYSTICK MANTIĞI (Bırakınca Durma) ---
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let moveDir = { x: 0, y: 0 };
    let isTouchingJoy = false;

    joyZone.addEventListener('touchstart', handleJoyMove, { passive: false });
    joyZone.addEventListener('touchmove', handleJoyMove, { passive: false });
    joyZone.addEventListener('touchend', resetJoy, { passive: false });

    function handleJoyMove(e) {
      e.preventDefault();
      isTouchingJoy = true;
      const touch = e.touches[0];
      const rect = joyZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      let dist = Math.hypot(dx, dy);
      let maxRadius = rect.width / 2;

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveDir = { x: dx / maxRadius, y: dy / maxRadius };
    }

    function resetJoy(e) {
      if (e) e.preventDefault();
      isTouchingJoy = false;
      joyKnob.style.transform = `translate(0px, 0px)`;
      moveDir = { x: 0, y: 0 }; // Parmağı bırakınca hareketi sıfırla
    }

    // Klavyeli Bilgisayar Desteği (WASD)
    let keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // --- PEERJS MULTIPLAYER NETWORKING ---
    let peer = new Peer(myId);
    let connections = {};

    peer.on('open', () => {
      // Ortak havuz sunucusuna yayın yap
      setInterval(broadcastState, 1000 / 30);
    });

    peer.on('connection', conn => {
      setupConn(conn);
    });

    function setupConn(conn) {
      connections[conn.peer] = conn;
      conn.on('data', data => {
        if (data.type === 'state') {
          players[data.id] = data.player;
        } else if (data.type === 'chat') {
          addChatMsg(data.name, data.msg);
        }
      });
      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updateOnlineUI();
      });
    }

    function broadcastState() {
      Object.values(connections).forEach(conn => {
        if (conn.open) {
          conn.send({ type: 'state', id: myId, player: players[myId] });
        }
      });
      updateOnlineUI();
    }

    function updateOnlineUI() {
      document.getElementById('online').innerText = Object.keys(connections).length + 1;
    }

    // --- CHAT VE SÖZEL MİKROFON ---
    function sendChat(e) {
      if (e.key === 'Enter') {
        let input = document.getElementById('chat-input');
        let val = input.value.trim();
        if (val) {
          addChatMsg("Sen", val);
          Object.values(connections).forEach(c => c.open && c.send({ type: 'chat', name: players[myId].name, msg: val }));
          input.value = '';
        }
      }
    }

    function addChatMsg(name, msg) {
      let box = document.getElementById('chat-msgs');
      let p = document.createElement('p');
      p.innerHTML = `<b>${name}:</b> ${msg}`;
      box.appendChild(p);
      box.scrollTop = box.scrollHeight;
    }

    let micActive = false;
    async function toggleMic() {
      let btn = document.getElementById('mic-btn');
      if (!micActive) {
        try {
          await navigator.mediaDevices.getUserMedia({ audio: true });
          micActive = true;
          btn.innerText = "🎤 Mikrofon Açık";
          btn.classList.add('btn-active');
        } catch { alert("Mikrofon izni alınamadı!"); }
      } else {
        micActive = false;
        btn.innerText = "🎤 Mikrofonu Aç";
        btn.classList.remove('btn-active');
      }
    }

    // --- OYUN FİZİKLERİ VE GÜNCELLEME ---
    function updatePhysics() {
      let me = players[myId];
      if (!me) return;

      // Klavye veya Joystick Girdilerini Al
      let inputX = moveDir.x;
      let inputY = moveDir.y;

      if (keys['a'] || keys['arrowleft']) inputX = -1;
      if (keys['d'] || keys['arrowright']) inputX = 1;
      if (keys['w'] || keys['arrowup']) inputY = -1;
      if (keys['s'] || keys['arrowdown']) inputY = 1;

      // İvmelenme ve Büyüklüğe Göre Hız Limiti (Fizik Dengesi)
      let maxSpeed = Math.max(2, 7.5 - me.radius * 0.035);
      let accel = 0.4;

      if (Math.hypot(inputX, inputY) > 0.1) {
        me.vx += inputX * accel;
        me.vy += inputY * accel;
      } else {
        // Joystick bırakıldığında sürtünme ile hemen durma fiziki
        me.vx *= 0.75;
        me.vy *= 0.75;
      }

      // Hız Sınırlama
      let speed = Math.hypot(me.vx, me.vy);
      if (speed > maxSpeed) {
        me.vx = (me.vx / speed) * maxSpeed;
        me.vy = (me.vy / speed) * maxSpeed;
      }

      // Konum Güncelleme
      me.x += me.vx;
      me.y += me.vy;

      // Harita Duvar Sınırları
      me.x = Math.max(me.radius, Math.min(MAP_SIZE - me.radius, me.x));
      me.y = Math.max(me.radius, Math.min(MAP_SIZE - me.radius, me.y));

      // Yem Yeme Fizik Yarıçapı
      foods.forEach(f => {
        if (Math.hypot(me.x - f.x, me.y - f.y) < me.radius) {
          me.radius += 0.25;
          me.score += 10;
          f.x = Math.random() * MAP_SIZE;
          f.y = Math.random() * MAP_SIZE;
        }
      });
    }

    // --- ÇİZİM VE KAMERA ---
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let me = players[myId];
      if (!me) return;

      document.getElementById('score').innerText = Math.floor(me.score);

      ctx.save();
      // Kamerayı Oyuncuya Odakla
      ctx.translate(canvas.width / 2 - me.x, canvas.height / 2 - me.y);

      // Harita Duvarları
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 12;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // Yemleri Çiz
      foods.forEach(f => {
        ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = f.color; ctx.fill();
      });

      // Bütün Oyuncuları Çiz
      Object.keys(players).forEach(id => {
        let p = players[id];
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();

        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px system-ui';
        ctx.textAlign = 'center'; ctx.fillText(p.name, p.x, p.y - p.radius - 8);
      });

      ctx.restore();
    }

    function gameLoop() {
      updatePhysics();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
