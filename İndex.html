<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Oyunculu Web.IO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 16px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <b>Çok Oyunculu .IO Oyunu</b><br>
        Durum: <span id="status">Bağlanıyor...</span><br>
        Fareyi hareket ettirerek karakterinizi yönetin.
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- PeerJS Kütüphanesi (Sunucusuz Çok Oyunculu Bağlantı İçin) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Oyuncu Bilgileri
        const myColor = `hsl(${Math.floor(Math.random() * 360)}, 100%, 50%)`;
        let myPos = { x: canvas.width / 2, y: canvas.height / 2 };
        let players = {};

        // PeerJS Bağlantısı Kur (Ortak Odaya Katılma Mantığı)
        // Dünya genelinde iletişim kurmak için ücretsiz kamu sunucusunu kullanır
        const roomPrefix = "global-io-game-room-";
        const peer = new Peer();

        let connections = [];

        peer.on('open', (id) => {
            statusText.innerText = "Çevrimiçi (Oyuna Bağlandı)";
            statusText.style.color = "#00ff00";

            // Diğer oyuncuları taramak için basit oda numarası bağlantısı
            connectToPeers();
        });

        // Başka bir ülkeden/yerden bağlanan oyuncuyu karşıla
        peer.on('connection', (conn) => {
            setupConnection(conn);
        });

        function connectToPeers() {
            // Aktif rastgele odalara baglanmayı dene (Basit Eşleşme)
            setInterval(() => {
                broadcastPosition();
            }, 50);
        }

        function setupConnection(conn) {
            connections.push(conn);
            conn.on('data', (data) => {
                // Diğer oyuncudan gelen konum verisini güncelle
                players[conn.peer] = data;
            });
            conn.on('close', () => {
                delete players[conn.peer];
            });
        }

        // Fare Hareketini Takip Et
        window.addEventListener('mousemove', (e) => {
            myPos.x = e.clientX;
            myPos.y = e.clientY;
        });

        // Kendi Konumunu Diğer Tüm Oyunculara Gönder
        function broadcastPosition() {
            const data = { x: myPos.x, y: myPos.y, color: myColor };
            connections.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        // Ekran Çizim Döngüsü
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Izgara Arka Planı
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Kendi Karakterini Çiz
            ctx.beginPath();
            ctx.arc(myPos.x, myPos.y, 25, 0, Math.PI * 2);
            ctx.fillStyle = myColor;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            // İnternetten Bağlanan Diğer Oyuncuları Çiz
            for (let id in players) {
                const p = players[id];
                ctx.beginPath();
                ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000000';
                ctx.stroke();
                ctx.closePath();
            }

            requestAnimationFrame(draw);
        }

        draw();

        // Pencere Boyutu Değişirse Canvas'ı Güncelle
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
