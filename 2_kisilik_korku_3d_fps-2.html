<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2 Kişilik Korku FPS</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020204;color:#fff;font-family:Arial,sans-serif}#game{position:fixed;inset:0;display:flex;flex-direction:column}.screen{position:relative;flex:1;min-height:0;overflow:hidden;border-bottom:3px solid #111}.screen:last-child{border-bottom:0}.view{position:absolute;inset:0}.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;font-weight:900;text-shadow:0 2px 5px #000}.tag{background:#050507bb;padding:6px 10px;border:1px solid #ffffff20;border-radius:10px}.joy{position:absolute;bottom:12px;width:112px;height:112px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff25;z-index:8;touch-action:none}.joy.left{left:12px}.joy.right{right:12px}.knob{position:absolute;width:48px;height:48px;left:30px;top:30px;border-radius:50%;background:#a8a8a8aa;border:2px solid #fff5}.look{position:absolute;inset:0;z-index:3;touch-action:none}.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:#bbb;z-index:5;pointer-events:none;white-space:nowrap}.cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#ffffffaa}.cross:before{width:12px;height:1px;top:5px}.cross:after{height:12px;width:1px;left:5px}#scare{position:fixed;inset:0;background:#000;display:none;z-index:20;align-items:center;justify-content:center;text-align:center;color:#eee;font-size:28px;font-weight:900}#scare small{display:block;font-size:14px;color:#aaa;margin-top:10px}</style></head><body><div id="game"><section class="screen" id="s1"><canvas class="view"></canvas><div class="hud"><span class="tag">👤 OYUNCU 1</span><span class="tag">KAT: -1</span></div><div class="cross"></div><div class="look"></div><div class="joy left"><div class="knob"></div></div><div class="hint">Sol joystick: yürü • Ekrana sürükle: 360° bak</div></section><section class="screen" id="s2"><canvas class="view"></canvas><div class="hud"><span class="tag">👤 OYUNCU 2</span><span class="tag">KORKU SEVİYESİ: ☠</span></div><div class="cross"></div><div class="look"></div><div class="joy right"><div class="knob"></div></div><div class="hint">Sağ joystick: yürü • Ekrana sürükle: 360° bak</div></section></div><div id="scare">BİR ŞEY HAREKET ETTİ...<small>Oyuncular birlikte ilerleyin.</small></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const screens=[document.querySelector('#s1'),document.querySelector('#s2')];
const players=[];
const maze=[
'1111111111111111111','1000001000000000001','1011101011111111101','1000101000000000101','1110101110111110101','1000100000100010101','1011111111101010101','1000000000001010001','1011111111101011101','1000000000001000001','1011111111111111101','1000000000000000001','1111111111111111111'];
const CELL=5, wallH=3.6;
function wallAt(x,z){let c=Math.floor(x/CELL+maze[0].length/2),r=Math.floor(z/CELL+maze.length/2);return maze[r]?.[c]==='1'}
function makeWorld(scene){scene.background=new THREE.Color(0x020205);scene.fog=new THREE.FogExp2(0x020205,.045);scene.add(new THREE.HemisphereLight(0x202030,0x050505,.22));
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,70),new THREE.MeshStandardMaterial({color:0x151416,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);
 const wallMat=new THREE.MeshStandardMaterial({color:0x242126,roughness:.92}); const darkMat=new THREE.MeshStandardMaterial({color:0x08070b,roughness:1});
 for(let r=0;r<maze.length;r++)for(let c=0;c<maze[r].length;c++)if(maze[r][c]==='1'){
  let m=new THREE.Mesh(new THREE.BoxGeometry(CELL,wallH,CELL),wallMat);m.position.set((c-maze[0].length/2+.5)*CELL,wallH/2,(r-maze.length/2+.5)*CELL);scene.add(m);
 }
 // creepy rooms: beds, tables, doors, red lamps
 const props=[];
 function box(x,z,w,d,h,col){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:col,roughness:.8}));m.position.set(x,h/2,z);scene.add(m);props.push(m)}
 box(-30,-25,4,2,1,0x111015);box(-30,-25,3.8,1.8,.35,0x3b252a); // bed
 box(25,25,2,2,2,0x111);box(25,25,1.6,1.6,.4,0x4a2528);
 for(const [x,z] of [[-15,-10],[15,-10],[-20,15],[20,15]]){let bulb=new THREE.PointLight(0x33080a,1.8,10);bulb.position.set(x,2.8,z);scene.add(bulb);let lamp=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshBasicMaterial({color:0x880000}));lamp.position.copy(bulb.position);scene.add(lamp)}
 // paintings / eye symbols
 for(const [x,z,rot] of [[-10,-12,0],[10,12,Math.PI],[30,-15,Math.PI/2]]){let p=new THREE.Mesh(new THREE.BoxGeometry(1.8,.1,1.3),new THREE.MeshStandardMaterial({color:0x09090c}));p.position.set(x,1.9,z);p.rotation.y=rot;scene.add(p);let eye=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0x990000}));eye.position.set(x,1.95,z+.08);scene.add(eye)}
 // exit light
 let ex=new THREE.PointLight(0x164f22,1.3,12);ex.position.set(35,2.8,25);scene.add(ex);
}
function makeMonster(scene){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x090909,roughness:1});let body=new THREE.Mesh(new THREE.CapsuleGeometry(.7,2.2,6,10),mat);body.position.y=1.3;g.add(body);for(const x of [-.25,.25]){let e=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),new THREE.MeshBasicMaterial({color:0xff2020}));e.position.set(x,2.05,.62);g.add(e)}g.position.set(18,0,12);scene.add(g);return g}
function makePlayer(scene,color,x,z){const p={scene,cam:new THREE.PerspectiveCamera(78,1,.05,100),x,z,yaw:0,pitch:0,moveX:0,moveY:0};p.cam.position.set(x,1.55,z);p.cam.rotation.order='YXZ';scene.add(p.cam);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.9,5,8),new THREE.MeshStandardMaterial({color}));body.position.set(x,.75,z);scene.add(body);p.body=body;return p}
function initPlayer(i){const canvas=screens[i].querySelector('canvas'),scene=new THREE.Scene();makeWorld(scene);let monster=makeMonster(scene);let p=makePlayer(scene,i?0x4c7cff:0xffb52e,i?-18:-18,i?8:-8);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);players[i]={...p,renderer,monster};
 const joy=screens[i].querySelector('.joy'),knob=joy.querySelector('.knob'),look=screens[i].querySelector('.look');let active=false;joy.addEventListener('pointerdown',e=>{active=true;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(active)moveJoy(e)});['pointerup','pointercancel'].forEach(t=>joy.addEventListener(t,()=>{active=false;p.moveX=p.moveY=0;knob.style.transform=''}));function moveJoy(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),max=40;if(m>max){dx*=max/m;dy*=max/m}p.moveX=dx/max;p.moveY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
 let lx=0,ly=0,drag=false;look.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;p.yaw-=dx*.008;p.pitch=Math.max(-1.35,Math.min(1.35,p.pitch-dy*.006))});['pointerup','pointercancel'].forEach(t=>look.addEventListener(t,()=>drag=false));
 return scene}
for(let i=0;i<2;i++)initPlayer(i);
function blocked(p,nx,nz){const r=.45;return wallAt(nx+r,nz)||wallAt(nx-r,nz)||wallAt(nx,nz+r)||wallAt(nx,nz-r)}
let last=performance.now(),scareTimer=0;
function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;players.forEach((p,i)=>{let f=p.moveY,strafe=p.moveX;let speed=3.5;let nx=p.x+(Math.sin(p.yaw)*f+Math.cos(p.yaw)*strafe)*speed*dt;let nz=p.z+(Math.cos(p.yaw)*f-Math.sin(p.yaw)*strafe)*speed*dt;if(!blocked(p,nx,p.z))p.x=nx;if(!blocked(p,p.x,nz))p.z=nz;p.cam.position.set(p.x,1.55,p.z);p.cam.rotation.set(p.pitch,p.yaw,0);p.body.position.set(p.x,.75,p.z);let m=p.monster;let dx=p.x-m.position.x,dz=p.z-m.position.z,d=Math.hypot(dx,dz);if(d<14){m.position.x+=dx/d*dt*.9;m.position.z+=dz/d*dt*.9}if(d<2.3)scareTimer=1.2;let w=p.renderer.domElement.clientWidth,h=p.renderer.domElement.clientHeight;p.cam.aspect=w/h;p.cam.updateProjectionMatrix();p.renderer.setSize(w,h,false);p.renderer.render(p.scene,p.cam)});const scare=document.getElementById('scare');if(scareTimer>0){scareTimer-=dt;scare.style.display='flex';if(scareTimer<=0)scare.style.display='none'}requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>players.forEach(p=>{let c=p.renderer.domElement;p.renderer.setSize(c.clientWidth,c.clientHeight,false)}));
</script></body></html>
